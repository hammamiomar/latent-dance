name: CI

on:
  pull_request:
  push:
    branches: [main, public-main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libturbojpeg ffmpeg
      - run: uv sync --frozen
      - run: uv run --frozen ruff check
      - name: Run public CPU-safe tests
        run: >
          uv run --frozen pytest -q
          tests/test_backend_wiring.py
          tests/test_backends.py
          tests/test_device_policy.py
          tests/test_slot_messages.py
          tests/test_audio_pipeline_offload.py
          tests/test_caching.py
          tests/test_hermes_contracts.py
          tests/test_hermes_integration.py
          tests/test_song_library.py
          tests/test_song_profile.py
          tests/test_audio_status.py
          tests/unit/test_config.py
          tests/unit/test_destinations.py
          tests/unit/test_intensity_curves.py
          tests/unit/test_audio_separator.py
          tests/unit/test_sae_steering.py
          tests/unit/test_sae_autoencoder.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.5'
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20.19'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test:run
      - run: bun run lint

  public-audit:
    if: github.repository == 'hammamiomar/latent-dance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: bash scripts/release/public_audit.sh
