name: CI

on:
  pull_request:
  push:
    branches: [main, public-main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libturbojpeg ffmpeg
      - run: uv sync --frozen
      - run: uv run --frozen ruff check
      - run: uv run --frozen pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.5'
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20.19'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:run
      - run: bun run lint

  public-audit:
    if: github.repository == 'hammamiomar/latent-dance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: bash scripts/release/public_audit.sh
