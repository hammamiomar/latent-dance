[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hambajuba2ba.integrations.hermes" = ["skill/SKILL.md"]

[project]
name = "hambajuba2ba"
version = "0.1.0"
description = "Real-time audio-reactive SDXL-Turbo visualizer with SAE feature steering"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
authors = [{ name = "Omar Hammami" }]
requires-python = ">=3.11"

dependencies = [
  "diffusers==0.35.2",
  "transformers==4.57.1",
  "accelerate",
  "peft==0.17.0",
  "numpy",
  "pillow",
  "opencv-python",
  "huggingface_hub",
  "safetensors",
  "fire",
  "omegaconf",
  "fastapi[standard]",
  "uvicorn[standard]",
  "websockets",
  "pydantic-settings",
  "pyyaml>=6.0",
  "librosa>=0.11.0",
  "scipy>=1.14.0",
  "PyTurboJPEG>=1.7.0",  # Fast JPEG encoding (releases GIL, 5-10x faster than PIL)
  "opensimplex>=0.4",    # Perlin-like noise for sustained physics
  "pesto-pitch",         # Monophonic pitch tracking (vocals, bass)
  "basic-pitch",         # Polyphonic pitch tracking (piano, synths)
  # ONNX backend for Basic Pitch on local/CPU installs. On Linux x86_64 CUDA
  # runs, audio-gpu installs onnxruntime-gpu instead; installing both packages
  # makes the CPU wheel mask CUDAExecutionProvider.
  "onnxruntime ; sys_platform != 'linux' or platform_machine != 'x86_64'",
  # PyTorch — source index selected by platform in [tool.uv.sources]:
  # macOS → pytorch-cpu, Linux → pytorch-cu128 (Blackwell sm_120)
  "torch>=2.8",
  "torchvision>=0.23",
  "torchaudio>=2.8",
  "xformers ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]

# Audio processing: audio-separator (Demucs wrapper) + yt-dlp for YouTube
audio = [
  "audio-separator[cpu]",
  "setuptools>=70",       # audio-separator still imports pkg_resources.
  "yt-dlp>=2024.0.0",
]

# Audio with GPU acceleration (CUDA)
audio-gpu = [
  "audio-separator[gpu]",
  "setuptools>=70",       # audio-separator still imports pkg_resources.
  "onnxruntime-gpu ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "yt-dlp>=2024.0.0",
  # Beat tracking: Beat This! (ISMIR 2024) - state-of-the-art, PyTorch-native
  "beat-this @ git+https://github.com/CPJKU/beat_this.git",
  # Onset detection: madmom RNN - best for onset detection
  # Note: PyPI version (0.16.1) requires Python<3.10, use git for Python 3.11+
  "madmom @ git+https://github.com/CPJKU/madmom.git",
]

# SAE feature labeling pipeline
labeling = [
  "scikit-learn>=1.3",
  "umap-learn>=0.5",
  "httpx>=0.27",
  "sentence-transformers>=3.0",
  "datasets>=3.0",
]

# Optional cloud reproduction path for Stage 1 image generation + activation capture
labeling-modal = [
  "scikit-learn>=1.3",
  "umap-learn>=0.5",
  "httpx>=0.27",
  "sentence-transformers>=3.0",
  "datasets>=3.0",
  "modal>=0.73",
]

hermes = [
  "httpx>=0.27",
  "mcp>=1.13",
]

hermes-semantic = [
  "sentence-transformers>=3.0",
]

trt = [
  "tensorrt-cu12 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "tensorrt-cu12-libs ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "tensorrt-cu12-bindings ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "polygraphy ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "cuda-python==12.8 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnx ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnxruntime-gpu ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnx-graphsurgeon ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
# Ensure lock includes Linux x86_64 (for Docker) even when locking from macOS
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# basic-pitch drags in tensorflow on Linux, but TF 2.14 is broken with numpy 2.x.
# We use the ONNX backend — override to prevent TF from ever being installed.
override-dependencies = [
  "tensorflow ; python_version < '0'",
  "tensorflow-estimator ; python_version < '0'",
  "tensorflow-io-gcs-filesystem ; python_version < '0'",
]

dependency-metadata = [
  { name = "tensorrt-cu12",          version = "10.13.3.9", requires-dist = [] },
  { name = "tensorrt-cu12-libs",     version = "10.13.3.9", requires-dist = [] },
  { name = "tensorrt-cu12-bindings", version = "10.13.3.9", requires-dist = [] },
  # (Optional) If uv ever tries to peek at these during locking:
  { name = "onnx-graphsurgeon", requires-dist = [] },
  { name = "polygraphy",        requires-dist = [] }
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",   marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu",   marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cpu",   marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
xformers = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

"tensorrt-cu12"          = [{ index = "nvidia" }]
"tensorrt-cu12-libs"     = [{ index = "nvidia" }]
"tensorrt-cu12-bindings" = [{ index = "nvidia" }]
"polygraphy"             = [{ index = "nvidia" }]
"onnx-graphsurgeon"      = [{ index = "nvidia" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[project.scripts]
hambajuba = "hambajuba2ba.cli:serve"
hambajuba-hermes-mcp = "hambajuba2ba.integrations.hermes.mcp_server:main"
hambajuba-feature-embeddings = "hambajuba2ba.integrations.hermes.feature_embedding_cli:main"

[dependency-groups]
dev = [
  "pytest",
  "black",
  "ruff",
  "mypy",
  "ipykernel",
  "jupyter",
  "notebook",
  "colored",
  "ty",
  "soundfile",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
testpaths = ["tests"]
